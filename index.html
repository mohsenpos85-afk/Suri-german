<!doctype html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" as="image" href="/fuxi-mascot.png" />
    <meta name="theme-color" content="#5B5BD6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SURI" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SURI — Almanca Öğren</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker + seamless auto-update.
      // The new SW uses network-first for HTML, so a fresh index.html (with
      // current chunk hashes) is always fetched online — this prevents the
      // "stale cache → missing chunk → blank screen" failure. When a new SW
      // takes control, we reload ONCE so the page runs the new code. The
      // `hadController` guard avoids reloading on the very first install.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          const hadController = !!navigator.serviceWorker.controller;
          let refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (!hadController || refreshing) return; // first install → no reload
            refreshing = true;
            window.location.reload();
          });
          navigator.serviceWorker.register("/sw.js").then((reg) => {
            // Nudge the browser to check for a new SW on each load.
            reg.update().catch(() => {});
            reg.addEventListener("updatefound", () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener("statechange", () => {
                // A new SW finished installing while an old one still controls
                // the page → tell it to activate immediately.
                if (nw.state === "installed" && navigator.serviceWorker.controller) {
                  nw.postMessage("SKIP_WAITING");
                }
              });
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
