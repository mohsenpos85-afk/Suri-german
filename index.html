  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker. The SW uses network-first for HTML, so a
      // fresh index.html (with current chunk hashes) is always fetched online —
      // this prevents the "stale cache → missing chunk → blank screen" failure.
      // The SW self-activates (skipWaiting + clients.claim), so a new version
      // takes over on the next navigation. We deliberately do NOT force a
      // reload on controllerchange: that pattern can loop (the reload resets
      // its own guard), which is worse than a one-navigation-late update.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
